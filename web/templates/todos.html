{% extends 'base.html' %}
{% block content %}
<section class="page-panel todos-page-panel">
  <section class="panel-card todo-card single-page-card">
    <div class="section-head">
      <div>
        <h2>未完成 Todo</h2>
        <p class="section-note">设备端只拉取这里的内容。</p>
      </div>
      <span id="pending-count" class="section-count">0</span>
    </div>
    <section class="create-panel embedded-panel">
      <div class="panel-label-row">
        <span class="panel-label">快速新增</span>
        <span class="panel-tip">回车可直接提交</span>
      </div>
      <form id="create-form" class="create-form">
        <input id="todo-input" name="text" type="text" maxlength="96" autocomplete="off" placeholder="输入一条待办事项" />
        <button type="submit">添加</button>
      </form>
      <p id="form-error" class="inline-error" hidden></p>
    </section>
    <div id="pending-list" class="todo-list"></div>
  </section>

  <section class="panel-card completed-card single-page-card compact-gap-card">
    <div class="section-head compact-head">
      <div>
        <h2>已完成 Todo</h2>
        <p class="section-note">仅供查看，不支持恢复为未完成。</p>
      </div>
      <span id="completed-count" class="section-count">0</span>
    </div>
    <div id="completed-list" class="todo-list completed-list"></div>
  </section>

  <template id="todo-item-template">
    <article class="todo-item">
      <label class="toggle-wrap">
        <input class="todo-check" type="checkbox" />
        <span class="toggle-mark"></span>
      </label>
      <input class="todo-text" type="text" maxlength="96" />
      <div class="todo-actions">
        <button class="icon-button move-up" type="button" aria-label="move up">↑</button>
        <button class="icon-button move-down" type="button" aria-label="move down">↓</button>
        <button class="icon-button delete" type="button" aria-label="delete">✕</button>
      </div>
    </article>
  </template>

  <template id="completed-item-template">
    <article class="todo-item done readonly-item">
      <div class="readonly-mark">✓</div>
      <div class="readonly-copy">
        <p class="readonly-text"></p>
        <p class="readonly-meta"></p>
      </div>
    </article>
  </template>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/todos.js?v=20260610a" defer></script>
{% endblock %}
