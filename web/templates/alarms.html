{% extends 'base.html' %}
{% block content %}
<section class="page-panel alarms-page-panel">
  <section class="panel-card alarms-card single-page-card">
    <div class="section-head compact-head">
      <div>
        <h2>闹钟管理</h2>
        <p class="section-note">在这里安排每天的重要提醒</p>
      </div>
      <div class="header-actions">
        <button id="add-alarm" class="ghost-button" type="button">新增</button>
        <button id="save-alarms" type="button">保存闹钟</button>
      </div>
    </div>
    <div id="alarms-list" class="alarm-list"></div>
  </section>

  <template id="alarm-item-template">
    <article class="alarm-item">
      <div class="alarm-time-row">
        <label>时<input class="alarm-hour" type="number" min="0" max="23" /></label>
        <label>分<input class="alarm-minute" type="number" min="0" max="59" /></label>
      </div>
      <div class="alarm-toggle-row">
        <label><input class="alarm-repeat" type="checkbox" />重复</label>
        <label><input class="alarm-enabled" type="checkbox" />启用</label>
        <label><input class="alarm-voice" type="checkbox" />语音</label>
        <button class="ghost-button remove-alarm" type="button">删除</button>
      </div>
    </article>
  </template>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/alarms.js?v=20260610a" defer></script>
{% endblock %}
